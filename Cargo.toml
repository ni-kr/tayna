[package]
name = "tayna"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ni-kr/tayna"
description = "Policy-driven password generation library, with an optional CLI."
keywords = ["password", "generator", "security", "credentials", "cli"]
exclude = ["/.github"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"], optional = true }
rand = "0.10.2"
thiserror = "2.0.20"
zeroize = { version = "1.9", optional = true }

[features]
default = ["cli", "zeroize"]
# Enables the command-line interface and its `clap` dependency.
cli = ["dep:clap"]
# Wipes generated passwords from memory when they are dropped (best effort).
zeroize = ["dep:zeroize"]

[[bin]]
name = "tayna"
path = "src/bin/tayna.rs"
required-features = ["cli"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = "1.11.0"
